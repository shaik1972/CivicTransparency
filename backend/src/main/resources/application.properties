spring.application.name=Civic Transparency API

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civic_transparency}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civic_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

civic.security.pii-encryption-key=${CIVIC_ENCRYPTION_KEY:}
civic.auth.token-secret=${CIVIC_AUTH_TOKEN_SECRET:}
civic.auth.token-ttl-minutes=60

civic.notifications.email.enabled=${CIVIC_EMAIL_ENABLED:false}
civic.notifications.email.from=${CIVIC_EMAIL_FROM:}
civic.notifications.email.portal-url=${CIVIC_PORTAL_URL:http://localhost:3000/authority}
